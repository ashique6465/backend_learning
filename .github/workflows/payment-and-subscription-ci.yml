name: Payment and Subscription CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'payment_and_subscription/**'
      - '.github/workflows/payment-and-subscription-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'payment_and_subscription/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payment_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      rabbitmq:
        image: rabbitmq:3.12-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./payment_and_subscription
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt 2>/dev/null || pip install fastapi uvicorn stripe python-dotenv sqlalchemy pika pydantic

    - name: Lint with flake8
      working-directory: ./payment_and_subscription
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test imports
      working-directory: ./payment_and_subscription
      run: |
        python -c "import main"
        python -c "import models"
        python -c "import database"
        python -c "import worker"

    - name: Validate configuration
      working-directory: ./payment_and_subscription
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payment_db
        STRIPE_SECRET_KEY: sk_test_dummy
        STRIPE_WEBHOOK_SECRET: whsec_dummy
        GMAIL_ADDRESS: test@example.com
        GMAIL_APP_PASSWORD: dummy_password
      run: |
        python -c "from database import engine, SessionLocal; print('Database connection test passed')"

  security-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./payment_and_subscription
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

    - name: Install bandit
      run: pip install bandit

    - name: Security check with bandit
      working-directory: ./payment_and_subscription
      run: |
        bandit -r . -ll --skip B108,B324 || true

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./payment_and_subscription
        push: false
        tags: payment-and-subscription:latest
        file: ./payment_and_subscription/Dockerfile
        continue-on-error: true

  notify:
    needs: [lint-and-test, security-check]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check workflow status
      run: |
        if [ "${{ needs.lint-and-test.result }}" == "failure" ] || [ "${{ needs.security-check.result }}" == "failure" ]; then
          echo "❌ Payment and Subscription CI pipeline failed"
          exit 1
        else
          echo "✅ Payment and Subscription CI pipeline passed"
        fi
