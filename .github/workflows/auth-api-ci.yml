name: Auth API CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'auth_api/**'
      - '.github/workflows/auth-api-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'auth_api/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: ./auth_api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      working-directory: ./auth_api
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Start FastAPI server
      working-directory: ./auth_api
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 2
    
    - name: Test API endpoints
      run: |
        pip install requests
        python -c "
        import requests
        import time
        time.sleep(1)
        response = requests.post('http://localhost:8000/register', json={'email': 'test@example.com', 'password': 'test123', 'role': 'user'})
        print('Register:', response.status_code)
        "

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      working-directory: ./auth_api
      run: |
        docker build -t auth-api:latest .
    
    - name: Test Docker image
      working-directory: ./auth_api
      run: |
        docker run -d -p 8000:8000 auth-api:latest
        sleep 2
        docker ps
